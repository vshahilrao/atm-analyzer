<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Log Field Dashboard & Exporter</title>
    <!-- JSZip for Offline Extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #007acc;
            --accent-green: #28a745;
            --accent-red: #ff4d4d;
            --accent-yellow: #ffc107;
            --text-color: #ffffff;
            --subtext-color: #aaaaaa;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg-color); color: var(--text-color); padding: 15px; margin: 0; }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: var(--accent-blue); }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; background: var(--accent-blue); color: white; border: none; padding: 14px; font-size: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button.excel-btn { background: var(--accent-green); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        input[type="file"] { display: none; }
        .status { margin-top: 5px; font-size: 13px; color: var(--accent-yellow); text-align: center; }

        .table-container { overflow-x: auto; margin-top: 15px; background: var(--card-bg); border-radius: 6px; padding: 10px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
        th, td { padding: 8px; border: 1px solid #333; }
        th { background: #252526; color: var(--accent-yellow); }
        .total-row { font-weight: bold; background: #2a2a2a; color: #00e676; }

        .search-box { width: 100%; padding: 10px; margin-top: 15px; box-sizing: border-box; background: var(--card-bg); border: 1px solid #333; border-radius: 6px; color: white; }
        .card { background: var(--card-bg); padding: 12px; margin-top: 10px; border-radius: 6px; border-left: 4px solid var(--accent-blue); }
        .kw { color: var(--accent-red); font-weight: bold; }
        .act { color: #00e676; font-weight: bold; margin: 4px 0; font-size: 13px; }
        .raw-line { font-size: 11px; color: var(--subtext-color); font-family: monospace; background: #141414; padding: 6px; border-radius: 4px; }
    </style>
</head>
<body>

    <h2>ATM Troubleshooting Dashboard</h2>

    <div class="btn-group">
        <button onclick="document.getElementById('fileInput').click()">📂 Upload Logs / ZIP</button>
        <button id="downloadBtn" class="excel-btn" onclick="exportReport()" disabled>📊 Export Excel (CSV)</button>
    </div>
    <input type="file" id="fileInput" multiple accept=".txt,.log,.zip" onchange="handleFileSelection(this)">

    <div id="status" class="status"></div>

    <div id="dashboardSection" class="table-container" style="display:none;">
        <h3 style="font-size:14px; margin: 0 0 10px 0; color: var(--accent-yellow);">Date-Wise Code & Keyword Matrix</h3>
        <div id="tableWrapper"></div>
    </div>

    <input type="text" id="searchFilter" class="search-box" placeholder="🔍 Search keyword, date, or log details..." onkeyup="filterHits()" style="display:none;">

    <div id="results"></div>

    <script>
        const CODES = {
            "01": "DISPENSED SUCCESSFULLY",
            "02": "MOTOR TIMEOUT",
            "03": "SENSOR FAILURE",
            "11": "CASH JAM",
            "13": "SUSPECT CASH PICKEDUP",
            "15": "CASSETTE NOT ENABLED",
            "45": "CASSETTE INSERTION PROBLEM",
            "84": "I2C COMM ERROR"
        };

        const KEYWORDS = ["CASH JAM", "MOTOR TIMEOUT", "SENSOR FAILURE", "FAILURE", "SUSPECT", "E*2", "POWER CYCLE", "ERROR"];

        let aggregatedHits = [];
        let matrixData = {};

        async function handleFileSelection(input) {
            const files = input.files;
            if (!files.length) return;

            document.getElementById('status').innerText = "Analyzing files...";
            document.getElementById('results').innerHTML = "";
            aggregatedHits = [];
            matrixData = {};

            let totalFiles = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.name.endsWith('.zip')) {
                    totalFiles += await processZipFile(file);
                } else {
                    const text = await file.text();
                    parseLogContent(file.name, text);
                    totalFiles += 1;
                }
            }

            renderDashboard();
            document.getElementById('status').innerText = `Processed ${totalFiles} file(s). Found ${aggregatedHits.length} total hits.`;
            
            // Enable download button if hits exist
            const downloadBtn = document.getElementById('downloadBtn');
            if (aggregatedHits.length > 0) {
                downloadBtn.removeAttribute('disabled');
            } else {
                downloadBtn.setAttribute('disabled', 'true');
            }
        }

        async function processZipFile(zipFile) {
            let processed = 0;
            try {
                const zip = new JSZip();
                const unzipped = await zip.loadAsync(zipFile);
                for (let filename in unzipped.files) {
                    const zipEntry = unzipped.files[filename];
                    if (!zipEntry.dir && (filename.endsWith('.log') || filename.endsWith('.txt') || !filename.includes('.'))) {
                        const content = await zipEntry.async("string");
                        parseLogContent(zipEntry.name, content);
                        processed++;
                    }
                }
            } catch (err) {
                alert("Error unzipping file: " + err.message);
            }
            return processed;
        }

        function parseLogContent(filename, text) {
            const lines = text.split('\n');
            let currentDate = "Unknown Date";

            const filenameDateMatch = filename.match(/\b(\d{4}[_\-]\d{2}[_\-]\d{2}|\d{2}[_\-]\d{2}[_\-]\d{4})\b/);
            if (filenameDateMatch) {
                currentDate = filenameDateMatch[0].replace(/_/g, '-');
            }

            lines.forEach(line => {
                const lineUpper = line.toUpperCase();

                const inlineDateMatch = line.match(/(?:DATE\s*:\s*|DATE\s+)(\d{2}[\/\.-]\d{2}[\/\.-]\d{2,4})|\b(\d{4}[\/\.-]\d{2}[\/\.-]\d{2}|\d{2}[\/\.-]\d{2}[\/\.-]\d{4})\b/i);
                if (inlineDateMatch) {
                    currentDate = inlineDateMatch[1] || inlineDateMatch[2];
                }

                KEYWORDS.forEach(kw => {
                    const kwRegex = new RegExp(kw.replace('*', '.*'), 'i');
                    if (kwRegex.test(lineUpper)) {
                        
                        const codeMatch = line.match(/\b(\d{2})\b/);
                        let action = "Inspect general hardware state";
                        let keyLabel = kw;

                        if (codeMatch && CODES[codeMatch[1]]) {
                            action = `[Code ${codeMatch[1]}] ${CODES[codeMatch[1]]}`;
                            keyLabel = `Code ${codeMatch[1]} (${kw})`;
                        }

                        if (!matrixData[currentDate]) matrixData[currentDate] = {};
                        matrixData[currentDate][keyLabel] = (matrixData[currentDate][keyLabel] || 0) + 1;

                        aggregatedHits.push({
                            file: filename,
                            date: currentDate,
                            keyword: keyLabel,
                            action: action,
                            raw: line.trim()
                        });
                    }
                });
            });
        }

        function renderDashboard() {
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('searchFilter').style.display = 'block';

            let activeKeys = new Set();
            for (let d in matrixData) {
                for (let k in matrixData[d]) activeKeys.add(k);
            }
            let keyArray = Array.from(activeKeys);

            let tableHtml = '<table><thead><tr><th>Date</th>';
            keyArray.forEach(k => tableHtml += `<th>${k}</th>`);
            tableHtml += '<th>Total Hits</th></tr></thead><tbody>';

            let colTotals = {};
            keyArray.forEach(k => colTotals[k] = 0);
            let grandTotal = 0;

            for (let date in matrixData) {
                tableHtml += `<tr><td><b>${date}</b></td>`;
                let rowTotal = 0;

                keyArray.forEach(k => {
                    let count = matrixData[date][k] || 0;
                    tableHtml += `<td>${count > 0 ? count : '-'}</td>`;
                    rowTotal += count;
                    colTotals[k] += count;
                });

                grandTotal += rowTotal;
                tableHtml += `<td style="color:#00e676; font-weight:bold;">${rowTotal}</td></tr>`;
            }

            tableHtml += '<tr class="total-row"><td>TOTAL</td>';
            keyArray.forEach(k => tableHtml += `<td>${colTotals[k]}</td>`);
            tableHtml += `<td>${grandTotal}</td></tr></tbody></table>`;

            document.getElementById('tableWrapper').innerHTML = tableHtml;
            renderHits(aggregatedHits);
        }

        function renderHits(hits) {
            let resultsHtml = '';
            hits.forEach(hit => {
                resultsHtml += `
                    <div class="card">
                        <div style="color:var(--accent-yellow); font-size:11px;">📄 ${hit.file}</div>
                        <div><b>Date: ${hit.date}</b> | Issue: <span class="kw">${hit.keyword}</span></div>
                        <div class="act">🔧 ${hit.action}</div>
                        <div class="raw-line">${hit.raw}</div>
                    </div>`;
            });
            document.getElementById('results').innerHTML = resultsHtml;
        }

        function filterHits() {
            const query = document.getElementById('searchFilter').value.toLowerCase();
            const filtered = aggregatedHits.filter(h => 
                h.file.toLowerCase().includes(query) ||
                h.date.toLowerCase().includes(query) ||
                h.keyword.toLowerCase().includes(query) ||
                h.raw.toLowerCase().includes(query)
            );
            renderHits(filtered);
        }

        // Native Browser File Exporter (Direct CSV Download compatible with Microsoft Excel)
        function exportReport() {
            if (!aggregatedHits.length) return;

            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Header
            csvContent += "Source File,Date,Issue Code / Keyword,Recommended Action,Raw Log Line\n";

            // Rows
            aggregatedHits.forEach(h => {
                let cleanRaw = `"${h.raw.replace(/"/g, '""')}"`;
                let cleanAction = `"${h.action.replace(/"/g, '""')}"`;
                let cleanFile = `"${h.file.replace(/"/g, '""')}"`;
                csvContent += `${cleanFile},${h.date},"${h.keyword}",${cleanAction},${cleanRaw}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "ATM_Troubleshooting_Report.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
