<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Detected Error Categories</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(21, 32, 54, 0.75);
            --card-inner: #0d1527;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.3);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            padding: 24px 20px; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Action Panel Section */
        .action-panel { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px; 
            padding: 22px; 
            border: 1px solid var(--border-color); 
            border-left: 5px solid var(--accent-blue); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            max-width: 1200px;
            margin: 0 auto;
        }

        .action-header { 
            font-size: 15px; 
            font-weight: 800; 
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--accent-blue); 
            margin-bottom: 6px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .action-subtext {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 16px;
        }

        .error-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); 
            gap: 14px; 
        }

        .error-card { 
            background: var(--card-inner); 
            padding: 16px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            transition: all 0.25s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }

        .error-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -5px rgba(56, 189, 248, 0.3);
            background: rgba(13, 21, 39, 0.9);
        }

        .error-card-title { 
            font-weight: 700; 
            color: var(--text-main); 
            font-size: 13px;
            padding-right: 8px;
        }

        .badge { 
            background: rgba(244, 63, 94, 0.15); 
            color: #fb7185; 
            border: 1px solid rgba(244, 63, 94, 0.35);
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 800; 
            letter-spacing: 0.03em;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.2);
            white-space: nowrap;
        }

        /* Modal Popup */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(4, 7, 13, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background: #0f172a;
            border: 1px solid var(--accent-blue);
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(56, 189, 248, 0.2);
            position: relative;
            animation: modalFadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .modal-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--accent-yellow);
            line-height: 1.3;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 20px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--accent-red);
        }

        .modal-body {
            background: var(--card-inner);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-top: 12px;
        }

        .action-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-green);
            margin-bottom: 6px;
        }

        .action-text {
            font-size: 13.5px;
            color: var(--text-main);
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- Interactive Error Category Panel -->
    <div id="actionSummarySection" class="action-panel">
        <div class="action-header">⚡ Detected Error Categories</div>
        <div class="action-subtext">Click on any error box below to view its detailed action plan and resolution steps.</div>
        <div id="errorGrid" class="error-grid"></div>
    </div>

    <!-- Interactive Action Popup Modal -->
    <div id="actionModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div id="modalTitle" class="modal-title">Error Details</div>
                    <div id="modalCount" style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">0 Hits</div>
                </div>
                <button class="close-btn" onclick="hideModal()">✖</button>
            </div>
            <div class="modal-body">
                <div class="action-label">🛠️ Recommended Action Plan</div>
                <div id="modalActionText" class="action-text"></div>
            </div>
        </div>
    </div>

    <script>
        // Store category totals dynamically or load through your log parser
        let categoryTotals = {
            "Code 10 (DISPENSER NOT INITIALIZED)": 2
        };

        const ACTION_SOLUTIONS = {
            "SWITCH CONN FAILURE": "Check network switch power, LAN cabling, switch port connectivity, and host gateway IP configuration.",
            "CASH JAM": "Inspect transport belts, cash paths, sensors for torn notes, and clear physical jams.",
            "APP LEVEL ERROR": "Restart Application services, verify ATM application configs, check system logs.",
            "ATR ERROR": "Inspect Smart Card / Dip Reader module, clean contacts, test card driver interface.",
            "SUSPECT": "Examine suspect notes bin, test sensor calibration, check note validation module.",
            "FAILURE": "Check general peripheral hardware connections, power supply state, and driver connectivity.",
            "SENSOR FAILURE": "Clean optical sensors, inspect harness wiring, and perform sensor test.",
            "MOTOR TIMEOUT": "Check motor gearing mechanism, mechanical blockage, and power board supply.",
            "I2C COMM ERROR": "Re-seat internal communication ribbon cables, check motherboard controller connection.",
            "DISPENSER NOT INITIALIZED": "Check dispenser power cable, controller serial connection, and initialize dispenser via maintenance software."
        };

        function renderErrorGrid() {
            let errorGridHtml = '';
            for (let label in categoryTotals) {
                let count = categoryTotals[label];
                errorGridHtml += `
                    <div class="error-card" onclick="showActionModal('${encodeURIComponent(label)}')">
                        <div class="error-card-title">${label}</div>
                        <span class="badge">${count} Hits</span>
                    </div>`;
            }
            document.getElementById('errorGrid').innerHTML = errorGridHtml;
        }

        function showActionModal(encodedLabel) {
            const label = decodeURIComponent(encodedLabel);
            const count = categoryTotals[label] || 0;
            
            let recommendation = "Perform diagnostic evaluation on module.";
            for (let key in ACTION_SOLUTIONS) {
                if (label.includes(key)) {
                    recommendation = ACTION_SOLUTIONS[key];
                    break;
                }
            }

            document.getElementById('modalTitle').innerText = label;
            document.getElementById('modalCount').innerText = `${count} Total Occurrences Detected`;
            document.getElementById('modalActionText').innerText = recommendation;
            document.getElementById('actionModal').style.display = 'flex';
        }

        function hideModal() {
            document.getElementById('actionModal').style.display = 'none';
        }

        function closeModal(event) {
            if (event.target.id === 'actionModal') {
                hideModal();
            }
        }

        // Initialize display
        renderErrorGrid();
    </script>
</body>
</html>
