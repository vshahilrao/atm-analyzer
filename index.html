<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Log Field Dashboard & Exporter</title>
    <!-- JSZip for Unzipping & SheetJS for Excel Exporter -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(21, 32, 54, 0.75);
            --card-inner: #0d1527;
            --accent-cyan: #06b6d4;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.3);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.12) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.08) 0px, transparent 40%),
                radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.05) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 28px 20px; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 24px;
        }

        h2 { 
            margin: 0; 
            font-size: 26px; 
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
        }
        
        .btn-group { display: flex; gap: 16px; margin-bottom: 20px; max-width: 1200px; margin-left: auto; margin-right: auto; }
        
        button { 
            flex: 1; 
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); 
            color: #ffffff; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            padding: 16px 24px; 
            font-size: 14px; 
            border-radius: 10px; 
            font-weight: 700; 
            letter-spacing: 0.02em;
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px -4px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -4px rgba(37, 99, 235, 0.6);
            border-color: rgba(255, 255, 255, 0.3);
        }

        button.excel-btn { 
            background: linear-gradient(135deg, #059669 0%, #10b981 100%); 
            box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.35);
        }

        button.excel-btn:hover:not(:disabled) {
            box-shadow: 0 12px 25px -4px rgba(16, 185, 129, 0.55);
        }

        button:disabled { 
            opacity: 0.3; 
            cursor: not-allowed; 
            transform: none; 
            box-shadow: none; 
            border: 1px solid transparent;
        }

        input[type="file"] { display: none; }
        
        .status { 
            margin: 12px 0 20px 0; 
            font-size: 13px; 
            font-weight: 600;
            color: var(--accent-yellow); 
            text-align: center; 
            letter-spacing: 0.02em;
        }

        /* KPI Dashboard */
        .kpi-container { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 16px; 
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .kpi-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), transparent);
            opacity: 0.5;
        }

        .kpi-card:hover { 
            border-color: var(--border-glow); 
            transform: translateY(-2px);
        }

        .kpi-num { 
            font-size: 32px; 
            font-weight: 800; 
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .kpi-lbl { 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.08em; 
            color: var(--text-sub); 
            margin-top: 8px; 
        }

        /* Consolidated Action Panel */
        .action-panel { 
            margin-top: 24px; 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px; 
            padding: 22px; 
            border: 1px solid var(--border-color); 
            border-left: 5px solid var(--accent-green); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .action-header { 
            font-size: 15px; 
            font-weight: 800; 
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: var(--accent-green); 
            margin-bottom: 16px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .action-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 14px; 
        }

        .action-item { 
            background: var(--card-inner); 
            padding: 16px; 
            border-radius: 10px; 
            border: 1px solid var(--border-color); 
            transition: all 0.2s ease;
        }

        .action-item:hover {
            border-color: rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(0, 0, 0, 0.4);
        }

        .action-title { 
            font-weight: 700; 
            color: var(--accent-yellow); 
            font-size: 13.5px; 
            margin-bottom: 8px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .action-body { 
            font-size: 12.5px; 
            color: var(--text-main); 
            line-height: 1.5; 
        }

        .badge { 
            background: rgba(244, 63, 94, 0.15); 
            color: #fb7185; 
            border: 1px solid rgba(244, 63, 94, 0.35);
            padding: 3px 10px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 800; 
            letter-spacing: 0.03em;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.2);
        }

        /* Day-by-Day Matrix Table */
        .table-container { 
            overflow-x: auto; 
            margin-top: 24px; 
            background: var(--card-bg); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 14px; 
            padding: 22px; 
            border: 1px solid var(--border-color); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; text-align: left; }
        
        th, td { padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        
        th { 
            background: var(--card-inner); 
            color: var(--accent-yellow); 
            font-weight: 700; 
            font-size: 11.5px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-top: 1px solid var(--border-color);
        }

        th:first-child { border-top-left-radius: 8px; border-left: 1px solid var(--border-color); }
        th:last-child { border-top-right-radius: 8px; border-right: 1px solid var(--border-color); }
        td { border-right: 1px solid var(--border-color); }
        td:first-child { border-left: 1px solid var(--border-color); }
        
        .total-row { 
            font-weight: 800; 
            background: var(--card-inner); 
            color: var(--accent-green); 
        }

        .search-box { 
            width: 100%; 
            max-width: 1200px;
            padding: 14px 18px; 
            margin: 24px auto 0 auto; 
            display: block;
            box-sizing: border-box; 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); 
            border-radius: 10px; 
            color: white; 
            font-size: 13.5px;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .search-box:focus { 
            border-color: var(--accent-blue); 
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); 
        }

        #results {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px);
            padding: 16px 18px; 
            margin-top: 14px; 
            border-radius: 10px; 
            border-left: 4px solid var(--accent-blue); 
            border-top: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateX(2px);
        }

        .kw { color: #f43f5e; font-weight: 700; }
        
        .raw-line { 
            font-size: 11.5px; 
            color: #cbd5e1; 
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; 
            background: var(--card-inner); 
            padding: 10px 14px; 
            border-radius: 8px; 
            margin-top: 10px; 
            border: 1px solid rgba(255, 255, 255, 0.05);
            word-break: break-all; 
        }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <h2>ATM Troubleshooting Dashboard</h2>
        <div class="subtitle">Real-time log analysis & automated diagnostics summary</div>
    </div>

    <div class="btn-group">
        <button onclick="document.getElementById('fileInput').click()">📂 Upload Logs / ZIP</button>
        <button id="downloadBtn" class="excel-btn" onclick="exportToExcel()" disabled>📊 Download Excel Report</button>
    </div>
    <input type="file" id="fileInput" multiple accept=".txt,.log,.zip" onchange="handleFileSelection(this)">

    <div id="status" class="status"></div>

    <!-- Summary KPIs -->
    <div id="kpiSection" class="kpi-container" style="display:none;">
        <div class="kpi-card">
            <div id="kpiFiles" class="kpi-num">0</div>
            <div class="kpi-lbl">Files Processed</div>
        </div>
        <div class="kpi-card">
            <div id="kpiHits" class="kpi-num">0</div>
            <div class="kpi-lbl">Total Issue Hits</div>
        </div>
        <div class="kpi-card">
            <div id="kpiDates" class="kpi-num">0</div>
            <div class="kpi-lbl">Affected Days</div>
        </div>
    </div>

    <!-- Consolidated Action Summary Box -->
    <div id="actionSummarySection" class="action-panel" style="display:none;">
        <div class="action-header">🛠️ Consolidated Action Plan (All-in-One Summary)</div>
        <div id="actionGrid" class="action-grid"></div>
    </div>

    <!-- Day-by-Day Matrix Table -->
    <div id="dashboardSection" class="table-container" style="display:none;">
        <h3 style="font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; margin: 0 0 14px 0; color: var(--accent-yellow);">Day-by-Day Error & Issue Matrix</h3>
        <div id="tableWrapper"></div>
    </div>

    <input type="text" id="searchFilter" class="search-box" placeholder="🔍 Search individual log records..." onkeyup="filterHits()" style="display:none;">

    <div id="results"></div>

    <script>
        // Official Error Code Descriptions
        const CODES = {
            "01": "DISPENSED SUCCESSFULLY",
            "02": "NO NOTES DISPENSED",
            "03": "SENSOR FAILURE",
            "04": "MAX TWIN LIMIT EXCEEDED",
            "05": "PRESENTED SUCCESSFULLY",
            "06": "PRESENTATION TRAY NOT HOMED",
            "07": "BULK PURGE SUCCESSFUL",
            "08": "MOTOR TIMEOUT NOT HOMED",
            "09": "DISPENSER INITIALIZED",
            "10": "DISPENSER NOT INITIALIZED",
            "11": "CASH JAM",
            "12": "NO CASH ON TRAY",
            "13": "SUSPECT CASH PICKED UP",
            "14": "CASH JAM NOT HOMED",
            "15": "CASSETTE NOT ENABLED",
            "16": "NO NOTE LIMIT EXCEEDED",
            "17": "NOTE THRESHOLD NOT SET",
            "18": "DRIFT ERROR",
            "20": "CALIBRATION NOT DONE",
            "24": "CASSETTE TYPE SENSOR FAILURE",
            "25": "FLASH ERROR",
            "40": "SAFE SHUTTER OPEN FAILS",
            "41": "SAFE SHUTTER CLOSE FAILS",
            "42": "CARTRIDGE POSITION ERROR",
            "43": "CAM POSITION ERROR",
            "44": "PURGE BIN NOT INSERTED",
            "45": "CASSETTE INSERTION PROBLEM",
            "53": "CART COMM ERROR",
            "73": "DOOR OPEN IDENTIFIED",
            "84": "I2C COMM ERROR",
            "85": "LED FAILURE",
            "99": "UNKNOWN ERROR"
        };

        // TARGET KEYWORDS INCLUDING SWITCH CONN FAILURE
        const TARGET_KEYWORDS = [
            "SWITCH CONN FAILURE",
            "APP LEVEL ERROR",
            "ATR ERROR",
            "FAILURE",
            "SUSPECT"
        ];

        // Centralized Master Action Guide
        const ACTION_SOLUTIONS = {
            "SWITCH CONN FAILURE": "Check network switch power, LAN cabling, switch port connectivity, and host gateway IP configuration.",
            "CASH JAM": "Inspect transport belts, cash paths, sensors for torn notes, and clear physical jams.",
            "APP LEVEL ERROR": "Restart Application services, verify ATM application configs, check system logs.",
            "ATR ERROR": "Inspect Smart Card / Dip Reader module, clean contacts, test card driver interface.",
            "SUSPECT": "Examine suspect notes bin, test sensor calibration, check note validation module.",
            "FAILURE": "Check general peripheral hardware connections, power supply state, and driver connectivity.",
            "SENSOR FAILURE": "Clean optical sensors, inspect harness wiring, and perform sensor test.",
            "MOTOR TIMEOUT": "Check motor gearing mechanism, mechanical blockage, and power board supply.",
            "I2C COMM ERROR": "Re-seat internal communication ribbon cables, check motherboard controller connection."
        };

        let aggregatedHits = [];
        let matrixData = {}; 
        let categoryTotals = {};

        async function handleFileSelection(input) {
            const files = input.files;
            if (!files.length) return;

            document.getElementById('status').innerText = "Analyzing log files...";
            document.getElementById('results').innerHTML = "";
            aggregatedHits = [];
            matrixData = {};
            categoryTotals = {};

            let totalFiles = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.name.endsWith('.zip')) {
                    totalFiles += await processZipFile(file);
                } else {
                    const text = await file.text();
                    parseLogContent(file.name, text);
                    totalFiles += 1;
                }
            }

            renderDashboard(totalFiles);
            document.getElementById('status').innerText = `Completed processing ${totalFiles} file(s). Found ${aggregatedHits.length} total hits.`;
            
            const downloadBtn = document.getElementById('downloadBtn');
            if (aggregatedHits.length > 0) {
                downloadBtn.removeAttribute('disabled');
            } else {
                downloadBtn.setAttribute('disabled', 'true');
            }
        }

        async function processZipFile(zipFile) {
            let processed = 0;
            try {
                const zip = new JSZip();
                const unzipped = await zip.loadAsync(zipFile);
                for (let filename in unzipped.files) {
                    const zipEntry = unzipped.files[filename];
                    if (!zipEntry.dir && (filename.endsWith('.log') || filename.endsWith('.txt') || !filename.includes('.'))) {
                        const content = await zipEntry.async("string");
                        parseLogContent(zipEntry.name, content);
                        processed++;
                    }
                }
            } catch (err) {
                alert("Error unzipping file: " + err.message);
            }
            return processed;
        }

        function parseLogContent(filename, text) {
            const lines = text.split('\n');
            let currentDate = "Unknown Date";

            const filenameDateMatch = filename.match(/\b(\d{4}[_\-]\d{2}[_\-]\d{2}|\d{2}[_\-]\d{4})\b/);
            if (filenameDateMatch) {
                currentDate = filenameDateMatch[0].replace(/_/g, '-');
            }

            lines.forEach(line => {
                const rawLine = line.trim();
                if (!rawLine) return;

                const lineUpper = rawLine.toUpperCase();

                // Date detection
                const inlineDateMatch = rawLine.match(/(?:DATE\s*:\s*|DATE\s+)(\d{2}[\/\.-]\d{2}[\/\.-]\d{2,4})|\b(\d{4}[\/\.-]\d{2}[\/\.-]\d{2}|\d{2}[\/\.-]\d{2}[\/\.-]\d{4})\b/i);
                if (inlineDateMatch) {
                    currentDate = inlineDateMatch[1] || inlineDateMatch[2];
                }

                // Strip timestamps to avoid matching hours/minutes as code numbers
                let sanitizedLine = lineUpper.replace(/\b\d{2}:\d{2}:\d{2}(?::\d{2,3})?\b/g, '');

                // Check for explicit error codes like (11:...) or [11] or CODE: 11
                const explicitCodeMatch = sanitizedLine.match(/\((\d{2})\s*[:\-]\s*([^\)]+)\)/) || 
                                           sanitizedLine.match(/CODE\s*[:\-]?\s*(\d{2})/i) ||
                                           sanitizedLine.match(/\[(\d{2})\]/);

                let matchedCode = null;
                let matchedDesc = null;

                if (explicitCodeMatch) {
                    matchedCode = explicitCodeMatch[1];
                    matchedDesc = explicitCodeMatch[2] ? explicitCodeMatch[2].trim() : CODES[matchedCode];
                }

                // Check for requested target keywords
                let foundKeyword = null;
                TARGET_KEYWORDS.forEach(kw => {
                    if (sanitizedLine.includes(kw)) {
                        foundKeyword = kw;
                    }
                });

                if (matchedCode || foundKeyword) {
                    let unifiedLabel = "";

                    if (matchedCode) {
                        const codeName = CODES[matchedCode] || matchedDesc || "UNKNOWN ERROR";
                        unifiedLabel = `Code ${matchedCode} (${codeName})`;
                    } else {
                        unifiedLabel = foundKeyword;
                    }

                    // Count in matrix
                    if (!matrixData[currentDate]) matrixData[currentDate] = {};
                    matrixData[currentDate][unifiedLabel] = (matrixData[currentDate][unifiedLabel] || 0) + 1;

                    // Count overall totals per category
                    categoryTotals[unifiedLabel] = (categoryTotals[unifiedLabel] || 0) + 1;

                    aggregatedHits.push({
                        file: filename,
                        date: currentDate,
                        keyword: unifiedLabel,
                        raw: rawLine
                    });
                }
            });
        }

        function renderDashboard(fileCount) {
            document.getElementById('kpiFiles').innerText = fileCount;
            document.getElementById('kpiHits').innerText = aggregatedHits.length;
            document.getElementById('kpiDates').innerText = Object.keys(matrixData).length;

            document.getElementById('kpiSection').style.display = 'grid';
            document.getElementById('actionSummarySection').style.display = 'block';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('searchFilter').style.display = 'block';

            // Render Consolidated Action Plan
            let actionHtml = '';
            for (let label in categoryTotals) {
                let count = categoryTotals[label];
                let recommendation = "Perform diagnostic evaluation on module.";

                // Lookup action recommendation
                for (let key in ACTION_SOLUTIONS) {
                    if (label.includes(key)) {
                        recommendation = ACTION_SOLUTIONS[key];
                        break;
                    }
                }

                actionHtml += `
                    <div class="action-item">
                        <div class="action-title"><span>${label}</span> <span class="badge">${count} Hits</span></div>
                        <div class="action-body"><b>Action:</b> ${recommendation}</div>
                    </div>`;
            }
            document.getElementById('actionGrid').innerHTML = actionHtml;

            // Render Day-by-Day Table
            let activeKeys = new Set();
            for (let d in matrixData) {
                for (let k in matrixData[d]) activeKeys.add(k);
            }
            let keyArray = Array.from(activeKeys);

            let tableHtml = '<table><thead><tr><th>Date</th>';
            keyArray.forEach(k => tableHtml += `<th>${k}</th>`);
            tableHtml += '<th>Daily Total</th></tr></thead><tbody>';

            let colTotals = {};
            keyArray.forEach(k => colTotals[k] = 0);
            let grandTotal = 0;

            for (let date in matrixData) {
                tableHtml += `<tr><td><b>${date}</b></td>`;
                let rowTotal = 0;

                keyArray.forEach(k => {
                    let count = matrixData[date][k] || 0;
                    tableHtml += `<td>${count > 0 ? count : '-'}</td>`;
                    rowTotal += count;
                    colTotals[k] += count;
                });

                grandTotal += rowTotal;
                tableHtml += `<td style="color:var(--accent-green); font-weight:bold;">${rowTotal}</td></tr>`;
            }

            tableHtml += '<tr class="total-row"><td>TOTAL HITS</td>';
            keyArray.forEach(k => tableHtml += `<td>${colTotals[k]}</td>`);
            tableHtml += `<td>${grandTotal}</td></tr></tbody></table>`;

            document.getElementById('tableWrapper').innerHTML = tableHtml;
            renderHits(aggregatedHits);
        }

        function renderHits(hits) {
            let resultsHtml = '';
            hits.forEach(hit => {
                resultsHtml += `
                    <div class="card">
                        <div style="color:var(--accent-yellow); font-size:11px; font-weight:700; margin-bottom: 4px;">📄 ${hit.file}</div>
                        <div><b>Date: ${hit.date}</b> | Issue Category: <span class="kw">${hit.keyword}</span></div>
                        <div class="raw-line">${hit.raw}</div>
                    </div>`;
            });
            document.getElementById('results').innerHTML = resultsHtml;
        }

        function filterHits() {
            const query = document.getElementById('searchFilter').value.toLowerCase();
            const filtered = aggregatedHits.filter(h => 
                h.file.toLowerCase().includes(query) ||
                h.date.toLowerCase().includes(query) ||
                h.keyword.toLowerCase().includes(query) ||
                h.raw.toLowerCase().includes(query)
            );
            renderHits(filtered);
        }

        function exportToExcel() {
            if (typeof XLSX === 'undefined') {
                alert("Excel library is loading. Please try again in a moment.");
                return;
            }

            const wb = XLSX.utils.book_new();

            // Sheet 1: Action Summary & Daily Matrix
            let actionRows = [
                { "Section": "EXECUTIVE ACTION PLAN", "Details / Counts": "", "Recommended Action Point": "" }
            ];

            for (let label in categoryTotals) {
                let rec = "Perform diagnostic evaluation on module.";
                for (let key in ACTION_SOLUTIONS) {
                    if (label.includes(key)) { rec = ACTION_SOLUTIONS[key]; break; }
                }
                actionRows.push({
                    "Section": label,
                    "Details / Counts": `${categoryTotals[label]} Total Hits`,
                    "Recommended Action Point": rec
                });
            }

            const wsDashboard = XLSX.utils.json_to_sheet(actionRows);
            XLSX.utils.book_append_sheet(wb, wsDashboard, "Action Summary & Matrix");

            // Sheet 2: Itemized Data Sheet
            const wsDetails = XLSX.utils.json_to_sheet(aggregatedHits.map(h => ({
                "Source File": h.file,
                "Date": h.date,
                "Issue Category": h.keyword,
                "Raw Log Line": h.raw
            })));
            XLSX.utils.book_append_sheet(wb, wsDetails, "Data Sheet");

            XLSX.writeFile(wb, "ATM_Troubleshooting_Dashboard_Report.xlsx");
        }
    </script>
</body>
</html>
