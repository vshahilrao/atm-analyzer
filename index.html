<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Log Field Dashboard & Exporter</title>
    <!-- JSZip for Unzipping & SheetJS for Excel Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #f87171;
            --accent-yellow: #facc15;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --border-color: #334155;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg-color); color: var(--text-color); padding: 15px; margin: 0; }
        h2 { margin-top: 0; font-size: 20px; text-align: center; color: var(--accent-blue); }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 12px; }
        button { flex: 1; background: var(--accent-blue); color: #0f172a; border: none; padding: 14px; font-size: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button.excel-btn { background: var(--accent-green); color: #ffffff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        input[type="file"] { display: none; }
        .status { margin-top: 5px; font-size: 13px; color: var(--accent-yellow); text-align: center; }

        /* KPI Dashboard */
        .kpi-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .kpi-card { background: var(--card-bg); padding: 12px; border-radius: 6px; text-align: center; border: 1px solid var(--border-color); }
        .kpi-num { font-size: 22px; font-weight: bold; color: var(--accent-green); }
        .kpi-lbl { font-size: 11px; color: var(--subtext-color); margin-top: 4px; }

        /* Day-by-Day Matrix Table */
        .table-container { overflow-x: auto; margin-top: 15px; background: var(--card-bg); border-radius: 6px; padding: 12px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { padding: 10px; border: 1px solid var(--border-color); }
        th { background: #0f172a; color: var(--accent-yellow); font-weight: 600; }
        .total-row { font-weight: bold; background: #0f172a; color: var(--accent-green); }

        .search-box { width: 100%; padding: 12px; margin-top: 15px; box-sizing: border-box; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; color: white; }
        .card { background: var(--card-bg); padding: 12px; margin-top: 10px; border-radius: 6px; border-left: 4px solid var(--accent-blue); border: 1px solid var(--border-color); }
        .kw { color: var(--accent-red); font-weight: bold; }
        .act { color: var(--accent-green); font-weight: bold; margin: 4px 0; font-size: 13px; }
        .raw-line { font-size: 11px; color: var(--subtext-color); font-family: monospace; background: #0f172a; padding: 6px; border-radius: 4px; margin-top: 4px; }
    </style>
</head>
<body>

    <h2>ATM Troubleshooting Dashboard</h2>

    <div class="btn-group">
        <button onclick="document.getElementById('fileInput').click()">📂 Upload Logs / ZIP</button>
        <button id="downloadBtn" class="excel-btn" onclick="exportToExcel()" disabled>📊 Download Excel Report</button>
    </div>
    <input type="file" id="fileInput" multiple accept=".txt,.log,.zip" onchange="handleFileSelection(this)">

    <div id="status" class="status"></div>

    <!-- Summary KPIs -->
    <div id="kpiSection" class="kpi-container" style="display:none;">
        <div class="kpi-card">
            <div id="kpiFiles" class="kpi-num">0</div>
            <div class="kpi-lbl">Files Processed</div>
        </div>
        <div class="kpi-card">
            <div id="kpiHits" class="kpi-num">0</div>
            <div class="kpi-lbl">Total Issue Hits</div>
        </div>
        <div class="kpi-card">
            <div id="kpiDates" class="kpi-num">0</div>
            <div class="kpi-lbl">Affected Days</div>
        </div>
    </div>

    <!-- Day-by-Day Matrix -->
    <div id="dashboardSection" class="table-container" style="display:none;">
        <h3 style="font-size:14px; margin: 0 0 10px 0; color: var(--accent-yellow);">Day-by-Day Error & Issue Breakdown</h3>
        <div id="tableWrapper"></div>
    </div>

    <input type="text" id="searchFilter" class="search-box" placeholder="🔍 Search by code, date, or log content..." onkeyup="filterHits()" style="display:none;">

    <div id="results"></div>

    <script>
        // Mapping reference for explicit error code labels
        const CODES = {
            "01": "DISPENSED SUCCESSFULLY",
            "02": "NO NOTES DISPENSED",
            "03": "SENSOR FAILURE",
            "04": "MAX TWIN LIMIT EXCEEDED",
            "05": "PRESENTED SUCCESSFULLY",
            "06": "PRESENTATION TRAY NOT HOMED",
            "07": "BULK PURGE SUCCESSFUL",
            "08": "MOTOR TIMEOUT NOT HOMED",
            "09": "DISPENSER INITIALIZED",
            "10": "DISPENSER NOT INITIALIZED",
            "11": "CASH JAM",
            "12": "NO CASH ON TRAY",
            "13": "SUSPECT CASH PICKED UP",
            "14": "CASH JAM NOT HOMED",
            "15": "CASSETTE NOT ENABLED",
            "16": "NO NOTE LIMIT EXCEEDED",
            "17": "NOTE THRESHOLD NOT SET",
            "18": "DRIFT ERROR",
            "20": "CALIBRATION NOT DONE",
            "24": "CASSETTE TYPE SENSOR FAILURE",
            "25": "FLASH ERROR",
            "40": "SAFE SHUTTER OPEN FAILS",
            "41": "SAFE SHUTTER CLOSE FAILS",
            "42": "CARTRIDGE POSITION ERROR",
            "43": "CAM POSITION ERROR",
            "44": "PURGE BIN NOT INSERTED",
            "45": "CASSETTE INSERTION PROBLEM",
            "53": "CART COMM ERROR",
            "73": "DOOR OPEN IDENTIFIED",
            "84": "I2C COMM ERROR",
            "85": "LED FAILURE",
            "99": "UNKNOWN ERROR"
        };

        // Specific, unambiguous multi-word error phrases
        const EXPLICIT_PHRASES = [
            "CAMERA FAILURE",
            "SWITCH CONN FAILURE",
            "BM ERROR",
            "CASH JAM",
            "MOTOR TIMEOUT",
            "DISPENSER NOT INITIALIZED",
            "SENSOR FAILURE",
            "PURGE BIN NOT INSERTED",
            "CASSETTE INSERTION PROBLEM",
            "I2C COMM ERROR",
            "CART COMM ERROR",
            "SAFE SHUTTER OPEN FAILS",
            "SAFE SHUTTER CLOSE FAILS"
        ];

        let aggregatedHits = [];
        let matrixData = {}; 

        async function handleFileSelection(input) {
            const files = input.files;
            if (!files.length) return;

            document.getElementById('status').innerText = "Analyzing log files...";
            document.getElementById('results').innerHTML = "";
            aggregatedHits = [];
            matrixData = {};

            let totalFiles = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (file.name.endsWith('.zip')) {
                    totalFiles += await processZipFile(file);
                } else {
                    const text = await file.text();
                    parseLogContent(file.name, text);
                    totalFiles += 1;
                }
            }

            renderDashboard(totalFiles);
            document.getElementById('status').innerText = `Completed processing ${totalFiles} file(s). Found ${aggregatedHits.length} total hits.`;
            
            const downloadBtn = document.getElementById('downloadBtn');
            if (aggregatedHits.length > 0) {
                downloadBtn.removeAttribute('disabled');
            } else {
                downloadBtn.setAttribute('disabled', 'true');
            }
        }

        async function processZipFile(zipFile) {
            let processed = 0;
            try {
                const zip = new JSZip();
                const unzipped = await zip.loadAsync(zipFile);
                for (let filename in unzipped.files) {
                    const zipEntry = unzipped.files[filename];
                    if (!zipEntry.dir && (filename.endsWith('.log') || filename.endsWith('.txt') || !filename.includes('.'))) {
                        const content = await zipEntry.async("string");
                        parseLogContent(zipEntry.name, content);
                        processed++;
                    }
                }
            } catch (err) {
                alert("Error unzipping file: " + err.message);
            }
            return processed;
        }

        function parseLogContent(filename, text) {
            const lines = text.split('\n');
            let currentDate = "Unknown Date";

            // Extract date from filename if present
            const filenameDateMatch = filename.match(/\b(\d{4}[_\-]\d{2}[_\-]\d{2}|\d{2}[_\-]\d{2}[_\-]\d{4})\b/);
            if (filenameDateMatch) {
                currentDate = filenameDateMatch[0].replace(/_/g, '-');
            }

            lines.forEach(line => {
                const rawLine = line.trim();
                if (!rawLine) return;

                const lineUpper = rawLine.toUpperCase();

                // Extract date from line
                const inlineDateMatch = rawLine.match(/(?:DATE\s*:\s*|DATE\s+)(\d{2}[\/\.-]\d{2}[\/\.-]\d{2,4})|\b(\d{4}[\/\.-]\d{2}[\/\.-]\d{2}|\d{2}[\/\.-]\d{2}[\/\.-]\d{4})\b/i);
                if (inlineDateMatch) {
                    currentDate = inlineDateMatch[1] || inlineDateMatch[2];
                }

                // Strip timestamps (e.g., 11:00:07 or 11:00:07:123) to prevent misidentifying hours/minutes as error codes
                let sanitizedLine = lineUpper.replace(/\b\d{2}:\d{2}:\d{2}(?::\d{2,3})?\b/g, '');

                // Check for EXPLICIT parenthetical error code syntax (e.g., "(11:CASH JAM)" or "CODE: 11" or "[11]")
                const explicitCodeMatch = sanitizedLine.match(/\((\d{2})\s*[:\-]\s*([^\)]+)\)/) || 
                                           sanitizedLine.match(/CODE\s*[:\-]?\s*(\d{2})/i) ||
                                           sanitizedLine.match(/\[(\d{2})\]/);

                let matchedCode = null;
                let matchedDesc = null;

                if (explicitCodeMatch) {
                    matchedCode = explicitCodeMatch[1];
                    matchedDesc = explicitCodeMatch[2] ? explicitCodeMatch[2].trim() : CODES[matchedCode];
                }

                // Check for explicit multi-word error phrases
                let foundPhrase = null;
                EXPLICIT_PHRASES.forEach(phrase => {
                    if (sanitizedLine.includes(phrase)) {
                        foundPhrase = phrase;
                    }
                });

                // Record hit if either explicit code structure or specific error phrase was found
                if (matchedCode || foundPhrase) {
                    let unifiedLabel = "";
                    let action = "";

                    if (matchedCode) {
                        const codeName = matchedDesc || CODES[matchedCode] || "UNKNOWN ERROR";
                        unifiedLabel = `Code ${matchedCode} (${codeName})`;
                        action = `[Code ${matchedCode}] ${codeName}`;
                    } else {
                        unifiedLabel = foundPhrase;
                        action = `Inspect component failure: ${foundPhrase}`;
                    }

                    if (!matrixData[currentDate]) matrixData[currentDate] = {};
                    matrixData[currentDate][unifiedLabel] = (matrixData[currentDate][unifiedLabel] || 0) + 1;

                    aggregatedHits.push({
                        file: filename,
                        date: currentDate,
                        keyword: unifiedLabel,
                        action: action,
                        raw: rawLine
                    });
                }
            });
        }

        function renderDashboard(fileCount) {
            document.getElementById('kpiFiles').innerText = fileCount;
            document.getElementById('kpiHits').innerText = aggregatedHits.length;
            document.getElementById('kpiDates').innerText = Object.keys(matrixData).length;

            document.getElementById('kpiSection').style.display = 'grid';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('searchFilter').style.display = 'block';

            let activeKeys = new Set();
            for (let d in matrixData) {
                for (let k in matrixData[d]) activeKeys.add(k);
            }
            let keyArray = Array.from(activeKeys);

            let tableHtml = '<table><thead><tr><th>Date</th>';
            keyArray.forEach(k => tableHtml += `<th>${k}</th>`);
            tableHtml += '<th>Daily Total</th></tr></thead><tbody>';

            let colTotals = {};
            keyArray.forEach(k => colTotals[k] = 0);
            let grandTotal = 0;

            for (let date in matrixData) {
                tableHtml += `<tr><td><b>${date}</b></td>`;
                let rowTotal = 0;

                keyArray.forEach(k => {
                    let count = matrixData[date][k] || 0;
                    tableHtml += `<td>${count > 0 ? count : '-'}</td>`;
                    rowTotal += count;
                    colTotals[k] += count;
                });

                grandTotal += rowTotal;
                tableHtml += `<td style="color:var(--accent-green); font-weight:bold;">${rowTotal}</td></tr>`;
            }

            tableHtml += '<tr class="total-row"><td>TOTAL HITS</td>';
            keyArray.forEach(k => tableHtml += `<td>${colTotals[k]}</td>`);
            tableHtml += `<td>${grandTotal}</td></tr></tbody></table>`;

            document.getElementById('tableWrapper').innerHTML = tableHtml;
            renderHits(aggregatedHits);
        }

        function renderHits(hits) {
            let resultsHtml = '';
            hits.forEach(hit => {
                resultsHtml += `
                    <div class="card">
                        <div style="color:var(--accent-yellow); font-size:11px;">📄 ${hit.file}</div>
                        <div><b>Date: ${hit.date}</b> | Issue: <span class="kw">${hit.keyword}</span></div>
                        <div class="act">🔧 ${hit.action}</div>
                        <div class="raw-line">${hit.raw}</div>
                    </div>`;
            });
            document.getElementById('results').innerHTML = resultsHtml;
        }

        function filterHits() {
            const query = document.getElementById('searchFilter').value.toLowerCase();
            const filtered = aggregatedHits.filter(h => 
                h.file.toLowerCase().includes(query) ||
                h.date.toLowerCase().includes(query) ||
                h.keyword.toLowerCase().includes(query) ||
                h.raw.toLowerCase().includes(query)
            );
            renderHits(filtered);
        }

        function exportToExcel() {
            if (typeof XLSX === 'undefined') {
                alert("Excel library is loading. Please try again in a moment.");
                return;
            }

            const wb = XLSX.utils.book_new();

            // Sheet 1: Dashboard Matrix
            let matrixRows = [];
            let activeKeys = new Set();
            for (let d in matrixData) {
                for (let k in matrixData[d]) activeKeys.add(k);
            }
            let keyArray = Array.from(activeKeys);

            for (let date in matrixData) {
                let rowObj = { "Date": date };
                let dailyTotal = 0;
                keyArray.forEach(k => {
                    let count = matrixData[date][k] || 0;
                    rowObj[k] = count;
                    dailyTotal += count;
                });
                rowObj["Daily Total"] = dailyTotal;
                matrixRows.push(rowObj);
            }

            const wsDashboard = XLSX.utils.json_to_sheet(matrixRows);
            XLSX.utils.book_append_sheet(wb, wsDashboard, "Dashboard Sheet");

            // Sheet 2: Data Sheet
            const wsDetails = XLSX.utils.json_to_sheet(aggregatedHits.map(h => ({
                "Source File": h.file,
                "Date": h.date,
                "Error Code / Issue": h.keyword,
                "Action Point": h.action,
                "Raw Log Line": h.raw
            })));
            XLSX.utils.book_append_sheet(wb, wsDetails, "Data Sheet");

            XLSX.writeFile(wb, "ATM_Troubleshooting_Dashboard_Report.xlsx");
        }
    </script>
</body>
</html>
