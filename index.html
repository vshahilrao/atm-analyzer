<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Log Field Dashboard & Exporter</title>
    <!-- JSZip for Unzipping & SheetJS for Excel Exporter -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(21, 32, 54, 0.75);
            --card-inner: #0d1527;
            --accent-cyan: #06b6d4;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #f43f5e;
            --accent-purple: #8b5cf6;
            --accent-yellow: #f59e0b;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(56, 189, 248, 0.3);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            background-image: 
                radial-gradient(at 10% 10%, rgba(56, 189, 248, 0.12) 0px, transparent 40%),
                radial-gradient(at 90% 90%, rgba(16, 185, 129, 0.08) 0px, transparent 40%),
                radial-gradient(at 50% 50%, rgba(139, 92, 246, 0.05) 0px, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main); 
            padding: 28px 20px; 
            margin: 0; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 24px;
        }

        h2 { 
            margin: 0; 
            font-size: 26px; 
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.3);
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
        }
